name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command / API request you ran and the output (the `ERROR <stage>:` line, server logs).
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Video URL (if public)
  - type: dropdown
    id: env
    attributes:
      label: How do you run it
      options: [Docker / compose, CLI on macOS (MLX), CLI on Linux, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
