# NVIDIA GPU override (experimental). Requires the NVIDIA Container Toolkit on the host.
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
#
services:
  transcribation:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    image: ghcr.io/fakktors/transcribationservicespy:${TAG:-latest}-cuda
    environment:
      TRANSCRIBE_DEVICE: cuda
      TRANSCRIBE_MODEL: large-v3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
